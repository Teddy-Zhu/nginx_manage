openapi: 3.0.3
info:
  title: NginxPanel Management API
  version: 0.1.0
  description: 首版发布前直接维护当前唯一合同。所有 JSON 响应使用统一外壳。
externalDocs:
  description: 受控远程资源 API 合同
  url: ./remote.openapi.json
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /firewall/policy:
    get:
      operationId: getFirewallPolicy
      x-scopes: [read]
      description: 返回 FirewallPolicyView。未保存时 version 为 0；仅表示期望策略，不代表内核生效。
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    put:
      operationId: setFirewallPolicy
      x-scopes: [security.write]
      description: 版本 CAS、加密策略、幂等响应与审计同事务；允许模块停用时保存期望，不触发宿主机应用。浏览器须近期认证。最多 1000 条规则及 256 KiB 规范策略，来源须匹配地址族。
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}]
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/FirewallPolicyInput"}}}}
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /firewall/preview:
    post:
      operationId: previewFirewall
      x-scopes: [read]
      description: 读取指定的已保存版本，返回 FirewallPreview；直接 nftables 生成有界表达式及程序摘要，其他后端或 Docker 路径明确阻塞。结合 Agent 诊断核对环境；不发送 netlink 事务，不是执行授权或外部连通性证明，can_apply 为 false。
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/FirewallPreviewInput"}}}}
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /firewall:
    get:
      operationId: getFirewall
      x-scopes: [read]
      description: 宿主机只读防火墙诊断；返回 FirewallObservation。分别读取管理器、默认 iptables 命令、nft/legacy 规则结构和 Docker 标记；不修改规则，不将表名或链名当作所有权或外部可达性证明。Agent 缓存 30 秒，缺失或超限视图明确不可用。
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /backups:
    get:
      operationId: listBackups
      x-scopes: [backup.export]
      description: 本机完整备份概览及最近 128 条记录；包包含全部业务秘密，下载额外要求 backup.secrets 和近期认证。拒绝递归转发。
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    post:
      operationId: createBackup
      x-scopes: [backup.export, backup.secrets, system.write]
      description: 幂等创建完整加密备份。口令仅驻当前进程内存；一致性捕获使用共同维护边界，释放维护后流式加密，完成前不可下载。须近期认证及直接连接本节点。
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}]
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/BackupInput"}}}}
      responses: {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /backups/policy:
    get:
      operationId: getBackupPolicy
      x-scopes: [backup.export]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    put:
      operationId: setBackupPolicy
      x-scopes: [backup.export, backup.secrets, system.write]
      description: 版本比较后保存公钥、离线密钥确认、授权期限、周期及保留策略；定期任务复查原授权主体、会话代次、Token 权限及期限。须近期认证。
      parameters: [{"$ref": "#/components/parameters/CSRF"}]
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/BackupPolicyInput"}}}}
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /backups/{id}:
    get:
      operationId: getBackup
      x-scopes: [backup.export]
      parameters: [{"$ref": "#/components/parameters/ID"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    delete:
      operationId: deleteBackup
      x-scopes: [backup.export, system.write]
      description: 删除已结束的本主体备份；auth.manage 可管理其他主体。持久化删除意图，下载期间拒绝清理，保留原任务与审计。cleanup_failed 可显式续办清理。须近期认证。
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /backups/{id}/download:
    post:
      operationId: createBackupDownload
      x-scopes: [backup.export, backup.secrets]
      description: 浏览器近期认证后签发绑定当前会话的 60 秒单次下载凭据；返回 BackupDownloadTicket，不返回备份或解密密钥。机器凭据直接调用 GET。
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    get:
      operationId: downloadBackup
      x-scopes: [backup.export, backup.secrets]
      description: 机器 Bearer 直接下载；浏览器须当前会话、近期认证及单次票据。流式返回 age 加密 tar，最多并发 2 个、5 分钟，持续复查授权，不支持 Range。错误采用统一 JSON 外壳。
      parameters:
        - {"$ref": "#/components/parameters/ID"}
        - {name: ticket, in: query, required: false, schema: {type: string, maxLength: 43}}
      responses:
        "200":
          description: 完整加密备份；X-Backup-SHA256 为加密文件散列。
          headers:
            X-Backup-SHA256: {schema: {type: string}}
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        "default": {"$ref": "#/components/responses/JSON"}
  /management/listener:
    get:
      operationId: getManagementListener
      x-scopes: [read, system.write]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    post:
      operationId: applyManagementListener
      description: 直接连接本节点并近期认证后暂用新监听。Agent 独立持久保存旧配置与 120 秒期限；新 TCP/TLS 连接确认后生效。相同幂等键只重放原操作。停用须从回环入口执行。拒绝递归转发，不返回私钥。
      x-scopes: [read, system.write]
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}]
      requestBody: {required: true, content: {application/json: {schema: {"$ref": "#/components/schemas/ManagementListenerInput"}}}}
      responses: {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /management/listener/operations/{id}:
    get:
      operationId: getManagementListenerOperation
      x-scopes: [read, system.write]
      parameters: [{"$ref": "#/components/parameters/ID"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /management/listener/operations/{id}/confirm:
    post:
      operationId: confirmManagementListener
      description: 须直接通过当前候选监听建立的新 TCP/TLS 连接确认。只证明当前观察来源到该节点的可达性，不推断其他公网来源。禁止使用回环入口或变更前已有连接确认。
      x-scopes: [read, system.write]
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /management/listener/operations/{id}/rollback:
    post:
      operationId: rollbackManagementListener
      x-scopes: [read, system.write]
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /remote/pairings:
    get:
      operationId: listPairings
      x-scopes: [nodes.manage, read, auth.manage]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    post:
      operationId: createPairing
      x-scopes: [nodes.manage, read, auth.manage]
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingInput"}}}}
      responses: {"201": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /remote/pairings/{id}:
    delete:
      operationId: revokePairing
      x-scopes: [nodes.manage, read, auth.manage]
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /remote/pairings/{id}/exchange:
    post:
      operationId: exchangePairing
      description: 独立后端通过短期配对秘密领取同一控制节点的临时凭据。拒绝 Cookie、Origin、Authorization 和递归转发。相同领取随机数仅重放原领取，确认后不再返回 Token。
      security: []
      parameters:
        - {"$ref": "#/components/parameters/ID"}
        - {"name": "X-Nginxpanel-Target-Node", "in": "header", "required": true, "schema": {"type": "string"}}
        - {"name": "X-Nginxpanel-Remote-Protocol", "in": "header", "required": true, "schema": {"type": "string", "enum": ["1"]}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingClaim"}}}}
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /remote/pairings/{id}/confirm:
    post:
      operationId: confirmPairing
      description: 仅原临时机器凭据可确认；确认与延长到批准有效期同事务。确认回执丢失后原凭据可重查，不创建第二份授权。
      security: [{bearerAuth: []}]
      parameters:
        - {"$ref": "#/components/parameters/ID"}
        - {"name": "X-Nginxpanel-Target-Node", "in": "header", "required": true, "schema": {"type": "string"}}
        - {"name": "X-Nginxpanel-Remote-Protocol", "in": "header", "required": true, "schema": {"type": "string", "enum": ["1"]}}
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingConfirmation"}}}}
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /nodes/pairings:
    get:
      operationId: listPairingJobs
      x-scopes: [nodes.manage, read]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
    post:
      operationId: startPairing
      x-scopes: [nodes.manage, read]
      parameters: [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}]
      requestBody: {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PairingJobInput"}}}}
      responses: {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /nodes/pairings/{id}:
    get:
      operationId: getPairingJob
      x-scopes: [nodes.manage, read]
      parameters: [{"$ref": "#/components/parameters/ID"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /nodes/pairings/{id}/resume:
    post:
      operationId: resumePairing
      x-scopes: [nodes.manage, read]
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /nodes/pairings/{id}/abandon:
    post:
      operationId: abandonPairing
      x-scopes: [nodes.manage, read]
      parameters: [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}]
      responses: {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}
  /nodes:
    {"get": {"operationId": "listNodes", "x-scopes": ["nodes.manage", "read"], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "createNode", "x-scopes": ["nodes.manage", "read"], "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NodeCreateInput"}}}}, "responses": {"201": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /nodes/{id}:
    {"get": {"operationId": "getNode", "parameters": [{"$ref": "#/components/parameters/ID"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "delete": {"operationId": "deleteNode", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /nodes/{id}/refresh:
    {"post": {"operationId": "refreshNode", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /remote/identity:
    {"get": {"operationId": "getRemoteIdentity", "x-scopes": ["read"], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /remote/authorization:
    {"delete": {"operationId": "revokeRemoteAuthorization", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"name": "X-Nginxpanel-Target-Node", "in": "header", "required": true, "description": "须匹配目标永久节点 ID，校验后才撤销当前 Token。", "schema": {"type": "string"}}]}}
  /panel/updates:
    {"get": {"operationId": "listPanelUpdates", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "createPanelUpdate", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PanelUpdateCreateInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /panel/updates/{id}:
    {"get": {"operationId": "getPanelUpdate", "parameters": [{"$ref": "#/components/parameters/ID"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /panel/updates/{id}/resume:
    {"post": {"operationId": "resumePanelUpdate", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/receiver:
    {"get": {"operationId": "getMigrationReceiver", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/receive/{id}:
    {"put": {"operationId": "receiveMigration", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationImportInput"}}}}, "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/push:
    {"get": {"operationId": "listMigrationPushes", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "startMigrationPush", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationPushInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/push/{id}:
    {"get": {"operationId": "getMigrationPush", "parameters": [{"$ref": "#/components/parameters/ID"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/push/{id}/resume:
    {"post": {"operationId": "resumeMigrationPush", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationPushResumeInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /maintenance:
    {"get": {"operationId": "getMaintenance", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "enterMaintenance", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MaintenanceStartInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /maintenance/{id}/release:
    {"post": {"operationId": "releaseMaintenance", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}], "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components/installations:
    {"get": {"operationId": "listNginxInstallations", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "createNginxInstallation", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/NginxInstallCreateInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components/installations/{id}:
    {"get": {"operationId": "getNginxInstallation", "parameters": [{"$ref": "#/components/parameters/ID"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components/installations/{id}/resume:
    {"post": {"operationId": "resumeNginxInstallation", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components/installations/{id}/cancel:
    {"post": {"operationId": "cancelNginxInstallation", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components:
    {"get": {"operationId": "getComponents", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components/tasks:
    {"get": {"operationId": "listComponentTasks", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "createComponentTask", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ComponentCreateInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations:
    {"get": {"operationId": "listMigrations", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/export:
    {"post": {"operationId": "exportMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationExportInput"}}}}}}
  /migrations/plan:
    {"post": {"operationId": "prepareMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationImportInput"}}}}}}
  /migrations/pull:
    {"post": {"operationId": "pullMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationPullInput"}}}}}}
  /migrations/{id}:
    {"get": {"operationId": "getMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/ID"}]}}
  /migrations/{id}/preflight:
    {"post": {"operationId": "preflightMigration", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}], "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/{id}/dependencies:
    {"post": {"operationId": "prepareMigrationDependencies", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationDependencyInput"}}}}, "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
