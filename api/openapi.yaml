      required: [values, editable, format]
      properties:
        values: { type: array, items: { type: string } }
        editable: { type: boolean }
        format: { type: string, enum: [value, tokens, lines] }
        reason: { type: string }
    Resource:
      type: object
      required: [id, kind, file_id, block_key, line, fields, metadata]
      properties:
        id: { type: string }
        kind: { type: string, enum: [http, stream] }
        file_id: { type: string }
        block_key: { type: string }
        metadata: { $ref: '#/components/schemas/ResourceMetadata' }
        line: { type: integer }
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Field' }
    Tree:
      type: object
      required: [revision_id, version, state, files, resources, diagnostics, access_lists, waf_policies, module_paths]
      properties:
        revision_id: { type: string }
        version: { type: integer, format: int64 }
        state: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/File' } }
        access_lists: { type: array, items: { $ref: '#/components/schemas/AccessList' } }
        waf_policies: { type: array, items: { $ref: '#/components/schemas/WAFPolicy' } }
        module_paths: { type: array, maxItems: 20000, description: 原文中的模块选择，草稿可能含重复或未批准路径，诊断会明确指出。, items: { type: string } }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/Diagnostic' } }
    ResourceMetadata:
      type: object
      required: [name, notes, enabled]
      properties:
        name: { type: string, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        enabled: { type: boolean }
    ResourceAction:
      type: object
      required: [base_version]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, maxLength: 128 }
    AccessList:
      type: object
      required: [id, file_id, name, notes, mode, entries, editable, reason]
      properties:
        id: { type: string }
        file_id: { type: string }
        name: { type: string }
        notes: { type: string }
        mode: { type: string }
        entries: { type: array, items: { type: string } }
        editable: { type: boolean }
        reason: { type: string }
    AccessListInput:
      type: object
      required: [base_version, name, notes, mode, entries]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        mode: { type: string, enum: [allowlist, denylist] }
        entries: { type: array, maxItems: 128, items: { type: string } }
    DiffRequest:
      type: object
      required: [base_revision, files]
      properties:
        base_revision: { type: string, description: 空值表示无站点初始配置。 }
        files: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/File' } }
    FileDifference:
      type: object
      required: [file_id, before_path, after_path, status, before_content, after_content, affected_resources, affected_resource_count, affected_resources_truncated]
      properties:
        file_id: { type: string }
        before_path: { type: string }
        after_path: { type: string }
        status: { type: string, enum: [added, removed, modified, moved] }
        before_content: { type: string }
        after_content: { type: string }
        affected_resources: { type: array, maxItems: 100, description: 可能受影响的资源，包含共享上下文的保守影响范围。, items: { type: string } }
        affected_resource_count: { type: integer }
        affected_resources_truncated: { type: boolean }
    Difference:
      type: object
      required: [base_revision, files, diagnostics]
      properties:
        base_revision: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/FileDifference' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/Diagnostic' } }
    ExternalFile:
      type: object
      required: [path, status, expected_sha256, observed_sha256, reason]
      properties:
        path: { type: string }
        status: { type: string, enum: [unchanged, modified, added, missing, unsafe, unreadable] }
        expected_sha256: { type: string }
        observed_sha256: { type: string }
        reason: { type: string }
    ExternalDetail:
      type: object
      required: [path, before_content, after_content, draft_content, capture_allowed, note]
      properties:
        path: { type: string }
        before_content: { type: string, description: 按原发布身份重建的预期运行副本。 }
        after_content: { type: string, description: 磁盘中的运行副本。 }
        draft_content: { type: string, description: 可精确还原时去除生成控制；否则保留磁盘原文，仍须安全整理。 }
        capture_allowed: { type: boolean }
        note: { type: string }
    ExternalSnapshot:
      type: object
      required: [revision_id, deployment_id, snapshot, integrity, complete, files, dependencies, module_dependencies, detail]
      properties:
        revision_id: { type: string }
        deployment_id: { type: string, description: 不可变发布身份，初始发布为空；相同逻辑修订可有不同发布身份。 }
        snapshot: { type: string }
        integrity: { type: boolean }
        complete: { type: boolean }
        files: { type: array, items: { $ref: '#/components/schemas/ExternalFile' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/ExternalFile' } }
        module_dependencies: { type: array, items: { $ref: '#/components/schemas/ExternalFile' } }
        detail: { allOf: [{ $ref: '#/components/schemas/ExternalDetail' }], nullable: true }
    CaptureExternalRequest:
      type: object
      required: [base_version, snapshot, path]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        snapshot: { type: string, minLength: 64, maxLength: 64 }
        path: { type: string, minLength: 1, maxLength: 1024 }
    RestoreExternalRequest:
      type: object
      required: [base_version, snapshot]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        snapshot: { type: string, minLength: 64, maxLength: 64 }
    ACMEAccount:
      type: object
      required: [id, name, email, environment, version, key_fingerprint, account_url, state, task_id, last_error, retry_after, terms_agreed_at, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        environment: { type: string, enum: [production, staging] }
        version: { type: integer, format: int64 }
        key_fingerprint: { type: string, description: 账户公钥 DER 的 SHA-256，不返回私钥。 }
        account_url: { type: string }
        state: { type: string, enum: [pending, registering, ready, failed] }
        task_id: { type: string }
        last_error: { type: string }
        retry_after: { type: integer, format: int64, description: 允许人工重试的最早 Unix 时间，零表示无退避限制。 }
        terms_agreed_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    ACMEAccountInput:
      type: object
      additionalProperties: false
      required: [name, email, environment, terms_agreed]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        email: { type: string, maxLength: 254 }
        environment: { type: string, enum: [production, staging] }
        terms_agreed: { type: boolean, description: 须明确同意 CA 当前服务条款。 }
    ACMEAccountAction:
      type: object
      additionalProperties: false
      required: [base_version, terms_agreed]
      properties:
        base_version: { type: integer, format: int64, minimum: 1 }
        terms_agreed: { type: boolean }
    DNSCredentialField:
      type: object
      required: [key, label, required]
      properties:
        key: { type: string }
        label: { type: string }
        required: { type: boolean }
    DNSProvider:
      type: object
      required: [id, name, fields]
      properties:
        id: { type: string }
        name: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/DNSCredentialField' } }
    DNSCredential:
      type: object
      required: [id, name, provider, version, field_names, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        version: { type: integer, format: int64 }
        field_names: { type: array, description: 仅返回已配置的字段名，所有字段值均不回显。, items: { type: string } }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    DNSCredentialInput:
      type: object
      additionalProperties: false
      required: [base_version, name, provider]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 128 }
        provider: { type: string, enum: [cloudflare, alidns, tencentcloud] }
        secrets:
          type: object
          description: 创建时必填。更新时省略以保留原字段；提供时完整替换，删除可选字段须不再提供该键。所有值均作为秘密加密存储。
          maxProperties: 2
          additionalProperties: { type: string, minLength: 1, maxLength: 2048, writeOnly: true }
    ACMEProfile:
      type: object
      required: [id, name, notes, version, account_id, credential_id, environment, domains, certificate_id, state, current_order_id, task_id, last_error, retry_after, created_at, updated_at, auto_renew, auto_deploy, deploy_after, deployment_error, renewal, challenge_type, http01_confirmed, order_unconfirmed]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        version: { type: integer, format: int64 }
        account_id: { type: string }
        credential_id: { type: string }
        challenge_type: { type: string, enum: [dns-01, http-01] }
        http01_confirmed: { type: boolean, description: 操作者已确认公网 80 端口及 A/AAAA 指向；不代表 CA 可达性验证结果。 }
        order_unconfirmed: { type: boolean, description: 当前订单的创建结果尚未确认，显式新建或停用前须确认重复申请风险。 }
        environment: { type: string, enum: [production, staging] }
        domains: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
        certificate_id: { type: string }
        state: { type: string, enum: [idle, issuing, issued, failed, recovery_required, archived] }
        current_order_id: { type: string }
        task_id: { type: string }
        last_error: { type: string }
        retry_after: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        auto_renew: { type: boolean }
        auto_deploy: { type: boolean }
        deploy_after: { type: integer, format: int64 }
        deployment_error: { type: string }
        renewal: { $ref: '#/components/schemas/ACMERenewal' }
    ACMERenewal:
      type: object
      required: [version_id, renew_at, source, next_check_at, last_check_at, window_start, window_end, explanation_url, check_failures, failures, paused, last_error]
      properties:
        version_id: { type: string }
        renew_at: { type: integer, format: int64 }
        source: { type: string, enum: ['', fallback, ari] }
        next_check_at: { type: integer, format: int64, description: 已持久化的 ARI 检查期限；自动续期关闭时仅签发后检查一次。 }
        last_check_at: { type: integer, format: int64 }
        window_start: { type: integer, format: int64 }
        window_end: { type: integer, format: int64 }
        explanation_url: { type: string }
        check_failures: { type: integer }
        failures: { type: integer }
        paused: { type: boolean }
        last_error: { type: string }
    ACMEPolicyInput:
      type: object
      additionalProperties: false
      required: [base_version, auto_renew, auto_deploy, reset_failures]
      properties:
        base_version: { type: integer, format: int64, minimum: 1 }
        auto_renew: { type: boolean }
        auto_deploy: { type: boolean }
        reset_failures: { type: boolean, description: 显式重置连续失败次数并恢复自动调度，不绕过 CA 冷却或未确认订单。 }
    ACMEProfileInput:
      type: object
      additionalProperties: false
      required: [name, notes, account_id, credential_id, domains, challenge_type, http01_confirmed]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        account_id: { type: string, format: uuid }
        credential_id: { type: string, maxLength: 36, description: DNS-01 必须提供有效凭据 ID；HTTP-01 必须为空字符串。 }
        challenge_type: { type: string, enum: [dns-01, http-01] }
        http01_confirmed: { type: boolean, description: HTTP-01 必须为 true，且申请域名不得包含通配符；DNS-01 必须为 false。 }
        domains: { type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: { type: string, maxLength: 253 } }
    ACMEIssueInput:
      type: object
      additionalProperties: false
      required: [base_version, new_order, acknowledge_uncertain]
      properties:
        base_version: { type: integer, format: int64, minimum: 1 }
        new_order: { type: boolean }
        acknowledge_uncertain: { type: boolean }
    ACMEArchiveInput:
      type: object
      additionalProperties: false
      required: [base_version, acknowledge_uncertain]
      properties:
        base_version: { type: integer, format: int64, minimum: 1 }
        acknowledge_uncertain: { type: boolean }
    ACMEDNSRecord:
      type: object
      required: [fqdn, state, last_error]
      properties:
        fqdn: { type: string }
        state: { type: string, enum: [preparing, present, cleaned, blocked] }
        last_error: { type: string }
    ACMEOrder:
      type: object
      required: [id, task_id, order_url, certificate_url, certificate_version_id, state, stage, last_error, created_at, dns_records, automatic, terminal, challenge_type, http01_state, http01_revision, http01_expires_at]
      properties:
        id: { type: string }
        task_id: { type: string }
        order_url: { type: string }
        certificate_url: { type: string }
        certificate_version_id: { type: string }
        state: { type: string }
        stage: { type: string }
        last_error: { type: string }
        created_at: { type: integer, format: int64 }
        automatic: { type: boolean }
        terminal: { type: boolean, description: CA 已明确确认订单或域名授权终止；须显式新建订单。 }
        challenge_type: { type: string, enum: [dns-01, http-01] }
        http01_state: { type: string, enum: [none, unknown, active, cleaned] }
        http01_revision: { type: string }
        http01_expires_at: { type: integer, format: int64 }
        dns_records: { type: array, items: { $ref: '#/components/schemas/ACMEDNSRecord' } }
    ACMEChangeResult:
      type: object
      required: [id, account, credential, profile, task_id, deleted]
      properties:
        id: { type: string }
        account: { allOf: [{ $ref: '#/components/schemas/ACMEAccount' }], nullable: true }
        credential: { allOf: [{ $ref: '#/components/schemas/DNSCredential' }], nullable: true }
        profile: { allOf: [{ $ref: '#/components/schemas/ACMEProfile' }], nullable: true }
        task_id: { type: string }
        deleted: { type: boolean }
    CertificateInput:
      type: object
      required: [base_version, name, notes, fullchain_pem, private_key_pem]
      properties:
        base_version: { type: integer, format: int64, minimum: 0, description: 证书资源版本；新建为零，与配置树版本独立。 }
        name: { type: string, minLength: 1, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        fullchain_pem: { type: string, maxLength: 131072 }
        private_key_pem: { type: string, maxLength: 16384, writeOnly: true }
    CertificateSummary:
      type: object
      required: [dns_names, ip_addresses, issuer, subject, not_before, not_after, chain_not_before, chain_not_after, fingerprint, key_algorithm, chain_length, trust]
      properties:
        dns_names: { type: array, maxItems: 64, items: { type: string } }
        ip_addresses: { type: array, maxItems: 64, items: { type: string } }
        issuer: { type: string }
        subject: { type: string }
        not_before: { type: integer, format: int64 }
        not_after: { type: integer, format: int64 }
        chain_not_before: { type: integer, format: int64 }
        chain_not_after: { type: integer, format: int64 }
        fingerprint: { type: string }
        key_algorithm: { type: string, enum: [RSA, ECDSA, Ed25519] }
        chain_length: { type: integer }
        trust: { type: string, enum: [system, private, self_signed, acme_staging], description: 保存时的链校验结果；ACME 测试证书不受浏览器信任。 }
    CertificateVersion:
      type: object
      required: [id, ordinal, summary, created_at, certificate_path, private_key_path, environment]
      properties:
        id: { type: string }
        ordinal: { type: integer, format: int64 }
        summary: { $ref: '#/components/schemas/CertificateSummary' }
        created_at: { type: integer, format: int64 }
        certificate_path: { type: string }
        private_key_path: { type: string }
        environment: { type: string, enum: [manual, production, staging] }
    CertificateBinding:
      type: object
      required: [version_id, revision_id, revision_version, revision_state, resource_id, file_id, purpose]
      properties:
        version_id: { type: string }
        revision_id: { type: string }
        revision_version: { type: integer, format: int64 }
        revision_state: { type: string, enum: [desired, applied, desired_applied] }
        resource_id: { type: string }
        file_id: { type: string }
        purpose: { type: string }
    Certificate:
      type: object
      required: [id, name, notes, version, latest_version_id, source, created_at, updated_at, versions, bindings, historical_references, bindings_truncated]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        version: { type: integer, format: int64 }
        latest_version_id: { type: string }
        source: { type: string, enum: [manual, acme] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        versions: { type: array, description: 列表仅含最新版本，详情包含全部保留版本。, items: { $ref: '#/components/schemas/CertificateVersion' } }
        bindings: { type: array, description: 当前期望及最近确认的已生效修订引用。, items: { $ref: '#/components/schemas/CertificateBinding' } }
        historical_references: { type: integer, format: int64 }
        bindings_truncated: { type: boolean, description: 列表最多展示 10 条当前引用，详情最多 100 条；额外历史引用另计。 }
    CertificateDeployInput:
      type: object
      additionalProperties: false
      required: [base_version, version_id]
      properties:
        base_version: { type: integer, format: int64, minimum: 1 }
        version_id: { type: string, format: uuid }
    CertificateDeployChange:
      type: object
      required: [file_id, resource_id, purpose, previous_version_id]
      properties:
        file_id: { type: string }
        resource_id: { type: string }
        purpose: { type: string }
        previous_version_id: { type: string }
    CertificateDeployPreview:
      type: object
      required: [certificate_id, version_id, base_version, basis_revision, changes]
      properties:
        certificate_id: { type: string }
        version_id: { type: string }
        base_version: { type: integer, format: int64 }
        basis_revision: { type: string }
        changes: { type: array, items: { $ref: '#/components/schemas/CertificateDeployChange' } }
    CertificateDeployment:
      type: object
      required: [task_id, certificate_id, version_id, basis_revision, revision_id, automatic, state, stage, last_error, created_at]
      properties:
        task_id: { type: string }
        certificate_id: { type: string }
        version_id: { type: string }
        basis_revision: { type: string }
        revision_id: { type: string }
        automatic: { type: boolean }
        state: { type: string }
        stage: { type: string }
        last_error: { type: string }
        created_at: { type: integer, format: int64 }
    CertificateDeploymentStatus:
      type: object
      required: [version_id, state, current_bindings, applied_bindings, desired_bindings, history]
      properties:
        version_id: { type: string }
        state: { type: string, enum: [unbound, pending, partial, applied] }
        current_bindings: { type: integer, format: int64, description: 已确认应用修订中的全部证书链绑定数。 }
        applied_bindings: { type: integer, format: int64, description: 已确认应用修订中使用最新版本的绑定数。 }
        desired_bindings: { type: integer, format: int64 }
        history: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/CertificateDeployment' } }
    CertificateResult:
      type: object
      required: [certificate, deleted]
      properties:
        certificate: { allOf: [{ $ref: '#/components/schemas/Certificate' }], nullable: true }
        deleted: { type: boolean }
    NginxFeature:
      type: object
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason: { type: string }
    NginxFeatures:
      type: object
      required: [available, version, features, reason, modules]
      properties:
        available: { type: boolean }
        version: { type: string }
        reason: { type: string }
        modules: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/NativeModule' } }
        features:
          type: object
          description: 目标实际编译及确认运行的能力；HTTP 与 Stream 的 map、访问控制、日志、连接限制等分别报告，不能跨上下文替代。原生受信模块尚未加载时，其候选能力在 modules 中报告，须由应用执行器验证加载。
          additionalProperties: { $ref: '#/components/schemas/NginxFeature' }
    NativeModule:
      type: object
      required: [id, name, path, sha256, available, running, features, reason]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        sha256: { type: string }
        available: { type: boolean, description: 批准内容与当前二进制绑定及文件校验通过，不代表已加载或 ABI 校验完成。 }
        running: { type: boolean, description: 相同散列副本所属发布已确认运行。 }
        features: { type: array, description: 已批准内容可提供的候选能力，包括对应编译参数确认的 Stream 默认子模块；available 不表示已经加载或通过 ABI 校验。, items: { type: string } }
        reason: { type: string }
    NativeModulesRequest:
      type: object
      required: [base_version, paths]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        paths: { type: array, maxItems: 16, items: { type: string, maxLength: 128 } }
    WAFPath:
      type: object
      required: [match, path]
      properties:
        match: { type: string, enum: [exact, prefix] }
        path: { type: string, minLength: 1, maxLength: 512 }
    WAFConfig:
      type: object
      required: [metadata, rate, rate_unit, burst, connections, reject_status, observe, body_size, methods, denied_paths, exempt_paths]
      properties:
        metadata: { $ref: '#/components/schemas/ResourceMetadata' }
        rate: { type: integer, minimum: 0, maximum: 100000, description: 零表示关闭请求限速。 }
        rate_unit: { type: string, enum: [r/s, r/m] }
        burst: { type: integer, minimum: 0, maximum: 10000 }
        connections: { type: integer, minimum: 0, maximum: 65535, description: 零表示关闭并发限制。 }
