      properties:
        backend: {type: string, enum: ['', iptables-nft, iptables-legacy]}
        registration: {$ref: '#/components/schemas/FirewallRegistrationView'}
    FirewallFirewalld:
      type: object
      additionalProperties: false
      required: ["registration", "running", "configured_backend", "default_zone", "panic", "zones", "policy_inventory", "reason"]
      properties:
        registration: {$ref: '#/components/schemas/FirewallRegistrationView', description: 独立 root 登记与业务回执核对；managed 表示已确认的受管配置，变更待确认或恢复时为 recovery_required，不凭同名或标记接管。}
        running: {"type": "boolean", "nullable": true}
        configured_backend: {"type": "string"}
        default_zone: {"type": "string"}
        panic: {"type": "boolean", "nullable": true}
        zones: {"type": "array", "items": {"$ref": "#/components/schemas/FirewallZone"}}
        policy_inventory: {"$ref": "#/components/schemas/FirewallFirewalldPolicyInventory"}
        reason: {"type": "string"}
    FirewallFirewalldPolicyInventory:
      type: object
      additionalProperties: false
      required: [available, policies, reason]
      description: 同一唯一服务所有者下的有界只读采集，runtime/permanent 为独立读取；失败不返回成功前缀，不能作为内核状态、所有权或执行授权。
      properties:
        available: {type: boolean}
        policies: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/FirewallFirewalldPolicy'}}
        reason: {type: string}
    FirewallFirewalldPolicy:
      type: object
      additionalProperties: false
      required: [name, active, active_ingress_zones, active_egress_zones, runtime, permanent]
      properties:
        name: {type: string, maxLength: 128}
        active: {type: boolean}
        active_ingress_zones: {type: array, maxItems: 128, items: {type: string}}
        active_egress_zones: {type: array, maxItems: 128, items: {type: string}}
        runtime: {allOf: [{$ref: '#/components/schemas/FirewallFirewalldPolicySettings'}], nullable: true, description: null 表示运行清单中不存在该 policy。}
        permanent: {allOf: [{$ref: '#/components/schemas/FirewallFirewalldPolicySettings'}], nullable: true, description: null 表示永久清单中不存在该 policy。}
    FirewallFirewalldPolicySettings:
      type: object
      additionalProperties: false
      required: [hash, target, priority, ingress_zones, egress_zones, rich_rules, entries, masquerade]
      properties:
        hash: {type: string, pattern: '^[0-9a-f]{64}$', description: 完整受支持返回字典的摘要，包含字段、D-Bus 类型、空值及列表顺序；不代表语义等价或内核证明。}
        target: {type: string, enum: ['', CONTINUE, ACCEPT, REJECT, DROP]}
        priority: {type: integer, format: int32, nullable: true}
        ingress_zones: {type: array, maxItems: 128, items: {type: string}}
        egress_zones: {type: array, maxItems: 128, items: {type: string}}
        rich_rules: {type: integer, minimum: 0, maximum: 8192}
        entries: {type: integer, minimum: 0, maximum: 8192, description: 服务、端口、源端口、转发端口、协议、ICMP 和 rich rule 条目总数，包含 rich_rules。}
        masquerade: {type: boolean, nullable: true}
    FirewallZone:
      type: object
      additionalProperties: false
      required: ["name", "interfaces", "sources"]
      properties:
        name: {"type": "string"}
        interfaces: {"type": "array", "items": {"type": "string"}}
        sources: {"type": "array", "items": {"type": "string"}}
    FirewallUFW:
      type: object
      additionalProperties: false
      required: ["installed", "enabled", "active", "ipv6", "rule_inventory", "registration", "reason"]
      properties:
        installed: {"type": "boolean"}
        enabled: {"type": "boolean", "nullable": true}
        active: {"type": "boolean", "nullable": true}
        ipv6: {type: boolean, nullable: true, description: 本机受信 /etc/default/ufw 的 IPV6 配置，无法严格读取时为 null；不代表内核 IPv6 规则生效。}
        rule_inventory: {$ref: '#/components/schemas/FirewallUFWRuleInventory'}
        registration: {$ref: '#/components/schemas/FirewallRegistrationView'}
        reason: {"type": "string"}
    FirewallUFWRuleInventory:
      type: object
      additionalProperties: false
      required: [available, hash, rules, commands, truncated, reason]
      description: 官方 ufw show added 的有界独立只读报告；最多 512 KiB、8192 条记录，失败不返回成功前缀。双栈可能合并显示、顺序仅为汇总，不证明内核状态或所有权，命令字符串仅供展示，不可重放。
      properties:
        available: {type: boolean}
        hash: {type: string, description: 完整原始报告的 SHA-256；不可用时为空。}
        rules: {type: integer, minimum: 0, maximum: 8192, description: 报告命令记录数，不是内核规则数。}
        commands: {type: array, maxItems: 128, items: {type: string, maxLength: 4096}, description: 最多 64 KiB 的报告前缀。}
        truncated: {type: boolean}
        reason: {type: string}
    FirewallIptables:
      type: object
      additionalProperties: false
      required: ["family", "backend", "version", "reason"]
      properties:
        family: {"type": "string"}
        backend: {"type": "string"}
        version: {"type": "string"}
        reason: {"type": "string"}
    FirewallRuleset:
      type: object
      additionalProperties: false
      required: ["id", "backend", "family", "available", "tables", "reason"]
      properties:
        id: {"type": "string"}
        backend: {"type": "string"}
        family: {"type": "string"}
        available: {"type": "boolean"}
        tables: {"type": "array", "items": {"$ref": "#/components/schemas/FirewallTable"}}
        reason: {"type": "string"}
    FirewallTable:
      type: object
      additionalProperties: false
      required: ["family", "name", "chains"]
      properties:
        family: {"type": "string"}
        name: {"type": "string"}
        chains: {"type": "array", "items": {"$ref": "#/components/schemas/FirewallChain"}}
    FirewallChain:
      type: object
      additionalProperties: false
      required: ["name", "type", "hook", "priority", "policy", "rules", "docker_user_jump"]
      properties:
        name: {"type": "string"}
        type: {"type": "string"}
        hook: {"type": "string"}
        priority: {"type": "integer", "format": "int64", "nullable": true}
        policy: {"type": "string"}
        rules: {"type": "integer"}
        docker_user_jump: {"type": "boolean"}
    FirewallDocker:
      type: object
      additionalProperties: false
      required: ["registration", "backend_hint", "evidence", "writable", "reason", "runtime", "capabilities"]
      properties:
        registration: {$ref: '#/components/schemas/FirewallDockerRegistrationView'}
        backend_hint: {"type": "string", "enum": [unknown, nftables, iptables, mixed]}
        evidence: {"type": "array", "items": {"type": "string"}}
        writable: {"type": "boolean", "description": "已核对独立本机授权且至少一个当前组合支持联合计划；未完成操作或修复时为 false。能力报告不授予规则写入，执行须另行生成完整计划。"}
        reason: {"type": "string"}
        runtime: {"$ref": "#/components/schemas/FirewallDockerRuntime"}
        capabilities: {"type": "array", "maxItems": 10, "items": {"$ref": "#/components/schemas/FirewallDockerCapability"}}
    FirewallDockerRegistrationView:
      type: object
      additionalProperties: false
      required: [backend, engine_hash, parent_operation_id, registration]
      description: Docker 转发独立本机 root 授权，绑定原 iptables 宿主机占用与 Docker 实例。registered/verified 只表示空命名空间授权及当前观察已核对，不表示规则安装、执行开放或外部可达。原意图及回执不随文件/API 迁移或备份授予目标权限。
      properties:
        backend: {type: string, enum: ['', iptables-nft, iptables-legacy]}
        engine_hash: {type: string}
        parent_operation_id: {type: string}
        registration: {$ref: '#/components/schemas/FirewallRegistrationView'}
    FirewallDockerRuntime:
      type: object
      additionalProperties: false
      required: [available, engine_hash, version, api_version, snapshot_hash, observed_at, rootless, swarm, networks, containers, published_ports, ports, truncated, reason]
      description: 固定本机 root Docker Socket 的有界只读报告。两次实例、网络及运行容器报告须一致；不是原子内核快照、所有权或规则写入证明。未映射至主机的 exposed-only 容器端口不计入；routed 模式不能从此清单推断完整发布范围。
      properties:
        available: {type: boolean}
        engine_hash: {type: string}
        version: {type: string, maxLength: 64}
        api_version: {type: string}
        snapshot_hash: {type: string}
        observed_at: {type: integer, format: int64}
        rootless: {type: boolean}
        swarm: {type: string}
        networks: {type: integer, minimum: 0, maximum: 128}
        containers: {type: integer, minimum: 0, maximum: 128}
        published_ports: {type: integer, minimum: 0, maximum: 1024}
        ports: {type: array, maxItems: 128, items: {"$ref": "#/components/schemas/FirewallDockerPublishedPort"}}
        truncated: {type: boolean}
        reason: {type: string, maxLength: 2048}
    FirewallDockerPublishedPort:
      type: object
      additionalProperties: false
      required: [container_id, family, protocol, host_ip, host_port, container_port, network_ids, path, reason]
      properties:
        container_id: {type: string, minLength: 64, maxLength: 64}
        family: {type: string, enum: [unknown, ipv4, ipv6]}
        protocol: {type: string, enum: [tcp, udp, sctp]}
        host_ip: {type: string, description: "原样报告主机发布地址，空字符串表示未报告；0.0.0.0 或 :: 是通配绑定，不是已选择的原始目的地址。"}
        host_port: {type: integer, minimum: 0, maximum: 65535, description: "0 表示未报告主机发布端口，不自动采用容器端口。"}
        container_port: {type: integer, minimum: 1, maximum: 65535}
        network_ids: {type: array, maxItems: 16, items: {type: string}}
        path: {type: string, enum: [bridge_nat_candidate, unconfirmed], description: "映射候选仍须核对原始目的、同族 DNAT、入口及转发出口；不证明已保护。"}
        reason: {type: string, maxLength: 2048}
    FirewallDockerCapability:
      type: object
      additionalProperties: false
      required: [backend, family, hook, observed, supported, reason]
      properties:
        backend: {type: string, enum: [direct-nftables, iptables-nft, iptables-legacy, firewalld, ufw]}
        family: {type: string, enum: [ipv4, ipv6]}
        hook: {type: string, enum: ["", DOCKER-USER, forward]}
        observed: {type: boolean, description: "观察到实际实例及明确的单一转发挂接，不代表具备所有权或可写。"}
        supported: {type: boolean, description: "当前后端及地址族观察到受支持的显式 iptables/DOCKER-USER 路径；仅表示可生成目标计划，仍须独立本机授权和完整绑定。"}
        reason: {type: string, maxLength: 2048}
    FirewallPortRange:
      type: object
      additionalProperties: false
      required: ["from", "to"]
      properties:
        from: {"type": "integer", "minimum": 1, "maximum": 65535}
        to: {"type": "integer", "minimum": 1, "maximum": 65535}
    FirewallRule:
      type: object
      additionalProperties: false
      required: ["id", "name", "enabled", "scope", "family", "protocol", "ports", "sources", "action", "priority", "interface", "comment"]
      properties:
        id: {"type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
        name: {"type": "string", "minLength": 1, "maxLength": 128}
        enabled: {"type": "boolean"}
        scope: {"type": "string", "description": "host_input 或 docker_published；Docker 原始目的与实际映射由独立应用计划绑定，不属于可迁移期望规则；普通逻辑预览不编译 Docker 转发"}
        family: {"type": "string", "description": "ipv4、ipv6 或 both；非空来源须覆盖所选地址族"}
        protocol: {"type": "string", "description": "tcp 或 udp"}
        ports: {"type": "array", "items": {"$ref": "#/components/schemas/FirewallPortRange"}, "minItems": 1, "maxItems": 16}
        sources: {"type": "array", "items": {"type": "string", "maxLength": 64}, "maxItems": 32, "description": "IP 或网络起点 CIDR；空数组表示任意来源；规范化后不得重复"}
        action: {"type": "string", "description": "allow、deny 或 reject"}
        priority: {"type": "integer", "minimum": 0, "maximum": 1000000}
        interface: {"type": "string", "maxLength": 15, "description": "目标入站接口；空字符串表示任意接口"}
        comment: {"type": "string", "maxLength": 512}
    FirewallPolicy:
      type: object
      additionalProperties: false
      required: ["backend", "rules"]
      properties:
        backend: {"type": "string", "description": "目标绑定：direct-nftables、iptables-nft、iptables-legacy、firewalld 或 ufw；五种后端均提供主机入站编译；Docker 目标编译仅支持显式 iptables 后端，执行尚未开放。"}
        rules: {"type": "array", "items": {"$ref": "#/components/schemas/FirewallRule"}, "maxItems": 1000}
    FirewallPolicyView:
      type: object
      additionalProperties: false
      required: ["version", "policy", "updated_at"]
      properties:
        version: {"type": "integer", "format": "int64"}
        policy: {"$ref": "#/components/schemas/FirewallPolicy"}
        updated_at: {"type": "integer", "format": "int64"}
    FirewallPolicyInput:
      type: object
      additionalProperties: false
      required: ["base_version", "policy"]
      properties:
        base_version: {"type": "integer", "format": "int64"}
        policy: {"$ref": "#/components/schemas/FirewallPolicy"}
    FirewallPreviewInput:
      type: object
      additionalProperties: false
      required: ["version"]
      properties:
        version: {"type": "integer", "format": "int64"}
    FirewallPreviewEntry:
      type: object
      additionalProperties: false
      required: ["rule_id", "family", "protocol", "source", "ports", "action", "interface", "priority", "backend_priority", "expression"]
      properties:
        backend_priority: {type: integer, nullable: true, minimum: -32768, maximum: -24577, description: firewalld 展开后的唯一负优先级；其他后端为 null。}
        expression: {type: string, maxLength: 512, description: firewalld 生成的完整 rich rule，或 UFW/iptables 生成参数的命令预览；直接 nftables 为空，不接受用户提供表达式或报告命令作为执行输入。}
        rule_id: {"type": "string"}
        family: {"type": "string"}
        protocol: {"type": "string"}
        source: {"type": "string"}
        ports: {"$ref": "#/components/schemas/FirewallPortRange"}
        action: {"type": "string"}
        interface: {"type": "string"}
        priority: {"type": "integer"}
    FirewallFirewalldPreview:
      type: object
      additionalProperties: false
      required: [policy, priority, target, ingress_zones, egress_zones, settings_bytes]
      description: 编译目标为独立 nginxpanel-host policy，ANY 到 HOST，优先级 -100、默认 CONTINUE；名称不构成所有权证明，不写入 runtime/permanent。
      properties:
        policy: {type: string}
        priority: {type: integer, format: int32}
        target: {type: string}
        ingress_zones: {type: array, maxItems: 1, items: {type: string}}
        egress_zones: {type: array, maxItems: 1, items: {type: string}}
        settings_bytes: {type: integer, minimum: 0, maximum: 491520, description: 全部编译 policy 设置的规范 JSON 字节数，包含未展示的规则；为观测字典的类型标记、缺省字段及独立身份元数据保留空间。}
    FirewallIPTablesFamilyPreview:
      type: object
      additionalProperties: false
      required: [family, binary, generated_rules]
      properties:
        family: {type: string, enum: [ipv4, ipv6]}
        binary: {type: string, enum: [iptables-nft, ip6tables-nft, iptables-legacy, ip6tables-legacy], description: 显式命令名，仅用于预览，不通过 PATH 或 API 请求执行。}
        generated_rules: {type: integer, minimum: 0, maximum: 8192}
    FirewallIPTablesPreview:
      type: object
      additionalProperties: false
      required: [program_bytes, base_rules, protection_rules, families]
      description: 主机入站的封闭参数编译，按地址族独立处理；不创建链、跳转或规则，不构成所有权与执行证明。
      properties:
        program_bytes: {type: integer, minimum: 0, maximum: 2097152}
        base_rules: {type: integer, minimum: 0, maximum: 4, description: 每个使用地址族的回环及已建立/关联连接返回规则。}
        protection_rules: {type: integer, minimum: 0, maximum: 8192}
        families: {type: array, maxItems: 2, items: {$ref: '#/components/schemas/FirewallIPTablesFamilyPreview'}}
    FirewallPreview:
      type: object
      additionalProperties: false
      required: ["iptables", "firewalld", "kernel", "transaction_hash", "transaction_bytes", "transaction_messages", "version", "policy_hash", "backend", "compiled", "can_apply", "table", "chain", "hook", "priority", "default_policy", "logical_rules", "generated_rules", "program_hash", "entries", "truncated", "observed_at", "errors", "warnings"]
      properties:
        iptables: {allOf: [{$ref: '#/components/schemas/FirewallIPTablesPreview'}], nullable: true}
        firewalld: {allOf: [{$ref: '#/components/schemas/FirewallFirewalldPreview'}], nullable: true}
        kernel: {"$ref": "#/components/schemas/FirewallKernelView"}
        transaction_hash: {"type": "string", "description": "绑定命名空间、目标表快照和含规则代次前置条件的完整新建事务摘要；不构成执行授权"}
        transaction_bytes: {"type": "integer", "minimum": 0, "maximum": 8388608}
        transaction_messages: {"type": "integer", "minimum": 0, "maximum": 8196}
        version: {"type": "integer", "format": "int64"}
        policy_hash: {"type": "string"}
        backend: {"type": "string"}
        compiled: {"type": "boolean"}
        can_apply: {"type": "boolean"}
        table: {"type": "string"}
        chain: {"type": "string"}
        hook: {"type": "string"}
        priority: {"type": "integer"}
        default_policy: {"type": "string"}
        logical_rules: {"type": "integer"}
        generated_rules: {"type": "integer", "description": "直接 nftables 为含回环/会话保护的内核规则数量；firewalld 为 rich rule 数量；UFW 为生成命令数；iptables 为各使用地址族的业务及基础返回规则合计，不计入管理器原有规则。"}
        program_hash: {"type": "string"}
        entries: {"type": "array", "items": {"$ref": "#/components/schemas/FirewallPreviewEntry"}, "maxItems": 128}
        truncated: {"type": "boolean"}
        observed_at: {"type": "integer", "format": "int64"}
        errors: {"type": "array", "items": {"type": "string"}}
        warnings: {"type": "array", "items": {"type": "string"}}
    FirewallKernelView:
      type: object
      additionalProperties: false
      description: 固定 inet 目标表在同一内核代次的有界快照；完整原始表达式仅参与摘要，不返回规则正文，不证明所有权。
      required: [available, table_exists, generation, namespace_id, fingerprint, chains, rules, bytes, observed_at, reason]
      properties:
        available: {type: boolean}
        table_exists: {type: boolean}
        generation: {type: integer, format: int64, minimum: 0, maximum: 4294967295}
        namespace_id: {type: string}
        fingerprint: {type: string}
        chains: {type: integer, minimum: 0, maximum: 128}
        rules: {type: integer, minimum: 0, maximum: 8192}
        bytes: {type: integer, minimum: 0, maximum: 8388608}
        observed_at: {type: integer, format: int64}
        reason: {type: string}
