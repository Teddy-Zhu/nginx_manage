openapi: 3.0.3
info:
  title: NginxPanel Management API
  version: 0.1.0
  description: 首版发布前直接维护当前唯一合同。所有 JSON 响应使用统一外壳。
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /system/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /system/version:
    get:
      operationId: getVersion
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /me:
    get:
      operationId: getMe
      security: []
      description: 匿名访问也返回 CSRF 与是否需要一次性引导初始化。
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /bootstrap:
    post:
      operationId: bootstrap
      security: []
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string, maxLength: 100 }
                username: { type: string, maxLength: 64 }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /session:
    post:
      operationId: login
      security: []
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: logout
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /session/reauthenticate:
    post:
      operationId: reauthenticate
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      description: 仅浏览器会话使用，更新五分钟的近期认证时间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /account/password:
    put:
      operationId: changePassword
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /sessions/revoke-all:
    post:
      operationId: revokeSessions
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /credentials:
    get:
      operationId: listCredentials
      x-scopes: [auth.manage]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    post:
      operationId: createCredential
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /credentials/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    delete:
      operationId: revokeCredential
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /system/capabilities:
    get:
      operationId: getCapabilities
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /system/modules:
    get:
      operationId: getModules
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /system/modules/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: setModule
      x-scopes: [system.write]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/config-tree:
    get:
      operationId: getConfigTree
      x-scopes: [config.secrets]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    put:
      operationId: saveConfigTree
      x-scopes: [config.write, config.secrets]
      description: 原文和投影同事务保存。validate 请求真实 Nginx 校验；apply 请求串行发布、运行确认及失败回滚。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRequest' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/apply:
    post:
      operationId: applyConfig
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version]
              properties:
                base_version: { type: integer, format: int64, minimum: 0 }
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/runtime:
    get:
      operationId: getNginxRuntime
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/config-tree/diff:
    post:
      operationId: diffConfigTree
      x-scopes: [config.secrets]
      description: 比较指定修订与请求中的完整原文树；原文差异包含秘密，浏览器需重新认证。
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiffRequest' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/external:
    get:
      operationId: inspectNginxExternal
      x-scopes: [config.secrets]
      description: 只读核对当前发布副本与已记录修订。path 只选择受管目录内已发现的文件；依赖只返回散列，不返回证书材料。
      parameters:
        - { name: path, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/external/capture:
    post:
      operationId: captureNginxExternal
      x-scopes: [config.write, config.secrets]
      description: 重新核对快照后，将选中文件合并为独立草稿；期望或磁盘内容冲突则拒绝，不应用外部配置。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureExternalRequest' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/external/restore:
    post:
      operationId: restoreNginxExternal
      x-scopes: [config.write, config.secrets, security.write]
      description: 重新核对外部快照，将当前已保存期望修订部署到新受管目录并确认运行结果；保留原外部目录，切换后不向外部内容回滚。浏览器需重新认证。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreExternalRequest' }
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/config-tree/preview:
    post:
      operationId: previewConfigTree
      x-scopes: [config.write, config.secrets]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/resources:
    post:
      operationId: createResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResource' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/resources/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      operationId: patchResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version, changes]
              properties:
                base_version: { type: integer, format: int64, minimum: 0 }
                metadata: { $ref: '#/components/schemas/ResourceMetadata' }
                changes:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/resources/{id}/copy:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: copyResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/access-lists:
    post:
      operationId: createAccessList
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessListInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/access-lists/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: updateAccessList
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessListInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteAccessList
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates:
    get:
      operationId: listCertificates
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    post:
      operationId: importCertificate
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getCertificate
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteCertificate
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: replaceCertificate
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/features:
    get:
      operationId: getNginxFeatures
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/waf-policies:
    post:
      operationId: createWAFPolicy
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WAFInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/waf-policies/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: updateWAFPolicy
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WAFInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteWAFPolicy
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/revisions:
    get:
      operationId: listRevisions
      x-scopes: [read]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/revisions/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getRevision
      x-scopes: [config.secrets]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /tasks:
    get:
      operationId: listTasks
      x-scopes: [read]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getTask
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /audit:
    get:
      operationId: listAudit
      x-scopes: [read]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: nginxpanel_session }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      description: 所有浏览器写操作必须携带，已验证机器 Token 无需此项。
      schema: { type: string }
    Idempotency: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
  responses:
    JSON:
      description: 统一响应；业务类型位于 data，失败时可为 null 或字段级诊断。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Response' }
  schemas:
    Response:
      type: object
      required: [code, message, data, request_id, node_id]
      properties:
        code: { type: string, description: 成功固定为 OK，失败使用稳定语义错误码。 }
        message: { type: string }
        data: { nullable: true }
        request_id: { type: string }
        node_id: { type: string }
    File:
      type: object
      required: [id, path, content, sha256]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        path: { type: string, maxLength: 256 }
        content: { type: string, maxLength: 262144 }
        sha256: { type: string }
    Diagnostic:
      type: object
      required: [file_id, line, code, message]
      properties:
        file_id: { type: string }
        line: { type: integer }
        code: { type: string }
        message: { type: string }
    Field:
      type: object
      required: [values, editable, format]
      properties:
        values: { type: array, items: { type: string } }
        editable: { type: boolean }
        format: { type: string, enum: [value, tokens, lines] }
        reason: { type: string }
    Resource:
      type: object
      required: [id, kind, file_id, block_key, line, fields, metadata]
      properties:
        id: { type: string }
        kind: { type: string, enum: [http, stream] }
        file_id: { type: string }
        block_key: { type: string }
        metadata: { $ref: '#/components/schemas/ResourceMetadata' }
        line: { type: integer }
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Field' }
    Tree:
      type: object
      required: [revision_id, version, state, files, resources, diagnostics, access_lists, waf_policies]
      properties:
        revision_id: { type: string }
        version: { type: integer, format: int64 }
        state: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/File' } }
        access_lists: { type: array, items: { $ref: '#/components/schemas/AccessList' } }
        waf_policies: { type: array, items: { $ref: '#/components/schemas/WAFPolicy' } }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/Diagnostic' } }
    ResourceMetadata:
      type: object
      required: [name, notes, enabled]
      properties:
        name: { type: string, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        enabled: { type: boolean }
    ResourceAction:
      type: object
      required: [base_version]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, maxLength: 128 }
    AccessList:
      type: object
      required: [id, file_id, name, notes, mode, entries, editable, reason]
      properties:
        id: { type: string }
        file_id: { type: string }
        name: { type: string }
        notes: { type: string }
        mode: { type: string }
        entries: { type: array, items: { type: string } }
        editable: { type: boolean }
        reason: { type: string }
    AccessListInput:
      type: object
      required: [base_version, name, notes, mode, entries]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        mode: { type: string, enum: [allowlist, denylist] }
        entries: { type: array, maxItems: 128, items: { type: string } }
    DiffRequest:
      type: object
      required: [base_revision, files]
      properties:
        base_revision: { type: string, description: 空值表示无站点初始配置。 }
        files: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/File' } }
    FileDifference:
      type: object
      required: [file_id, before_path, after_path, status, before_content, after_content, affected_resources, affected_resource_count, affected_resources_truncated]
      properties:
        file_id: { type: string }
        before_path: { type: string }
        after_path: { type: string }
        status: { type: string, enum: [added, removed, modified, moved] }
        before_content: { type: string }
        after_content: { type: string }
        affected_resources: { type: array, maxItems: 100, description: 可能受影响的资源，包含共享上下文的保守影响范围。, items: { type: string } }
        affected_resource_count: { type: integer }
        affected_resources_truncated: { type: boolean }
    Difference:
      type: object
      required: [base_revision, files, diagnostics]
      properties:
        base_revision: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/FileDifference' } }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/Diagnostic' } }
    ExternalFile:
      type: object
      required: [path, status, expected_sha256, observed_sha256, reason]
      properties:
        path: { type: string }
        status: { type: string, enum: [unchanged, modified, added, missing, unsafe, unreadable] }
        expected_sha256: { type: string }
        observed_sha256: { type: string }
        reason: { type: string }
    ExternalDetail:
      type: object
      required: [path, before_content, after_content, draft_content, capture_allowed, note]
      properties:
        path: { type: string }
        before_content: { type: string, description: 按原发布身份重建的预期运行副本。 }
        after_content: { type: string, description: 磁盘中的运行副本。 }
        draft_content: { type: string, description: 可精确还原时去除生成控制；否则保留磁盘原文，仍须安全整理。 }
        capture_allowed: { type: boolean }
        note: { type: string }
    ExternalSnapshot:
      type: object
      required: [revision_id, deployment_id, snapshot, integrity, complete, files, dependencies, detail]
      properties:
        revision_id: { type: string }
        deployment_id: { type: string, description: 不可变发布身份，初始发布为空；相同逻辑修订可有不同发布身份。 }
        snapshot: { type: string }
        integrity: { type: boolean }
        complete: { type: boolean }
        files: { type: array, items: { $ref: '#/components/schemas/ExternalFile' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/ExternalFile' } }
        detail: { allOf: [{ $ref: '#/components/schemas/ExternalDetail' }], nullable: true }
    CaptureExternalRequest:
      type: object
      required: [base_version, snapshot, path]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        snapshot: { type: string, minLength: 64, maxLength: 64 }
        path: { type: string, minLength: 1, maxLength: 1024 }
    RestoreExternalRequest:
      type: object
      required: [base_version, snapshot]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        snapshot: { type: string, minLength: 64, maxLength: 64 }
    CertificateInput:
      type: object
      required: [base_version, name, notes, fullchain_pem, private_key_pem]
      properties:
        base_version: { type: integer, format: int64, minimum: 0, description: 证书资源版本；新建为零，与配置树版本独立。 }
        name: { type: string, minLength: 1, maxLength: 128 }
        notes: { type: string, maxLength: 2048 }
        fullchain_pem: { type: string, maxLength: 131072 }
        private_key_pem: { type: string, maxLength: 16384, writeOnly: true }
    CertificateSummary:
      type: object
      required: [dns_names, ip_addresses, issuer, subject, not_before, not_after, chain_not_before, chain_not_after, fingerprint, key_algorithm, chain_length, trust]
      properties:
        dns_names: { type: array, maxItems: 64, items: { type: string } }
        ip_addresses: { type: array, maxItems: 64, items: { type: string } }
        issuer: { type: string }
        subject: { type: string }
        not_before: { type: integer, format: int64 }
        not_after: { type: integer, format: int64 }
        chain_not_before: { type: integer, format: int64 }
        chain_not_after: { type: integer, format: int64 }
        fingerprint: { type: string }
        key_algorithm: { type: string, enum: [RSA, ECDSA, Ed25519] }
        chain_length: { type: integer }
        trust: { type: string, enum: [system, private, self_signed], description: 导入时的链校验结果，不代表所有客户端均信任。 }
    CertificateVersion:
      type: object
      required: [id, ordinal, summary, created_at, certificate_path, private_key_path]
      properties:
        id: { type: string }
        ordinal: { type: integer, format: int64 }
        summary: { $ref: '#/components/schemas/CertificateSummary' }
        created_at: { type: integer, format: int64 }
        certificate_path: { type: string }
        private_key_path: { type: string }
    CertificateBinding:
      type: object
      required: [version_id, revision_id, revision_version, revision_state, resource_id, file_id, purpose]
      properties:
        version_id: { type: string }
        revision_id: { type: string }
        revision_version: { type: integer, format: int64 }
        revision_state: { type: string, enum: [desired, applied, desired_applied] }
        resource_id: { type: string }
        file_id: { type: string }
        purpose: { type: string }
    Certificate:
      type: object
      required: [id, name, notes, version, latest_version_id, source, created_at, updated_at, versions, bindings, historical_references, bindings_truncated]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        version: { type: integer, format: int64 }
        latest_version_id: { type: string }
        source: { type: string, enum: [manual, acme] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        versions: { type: array, description: 列表仅含最新版本，详情包含全部保留版本。, items: { $ref: '#/components/schemas/CertificateVersion' } }
        bindings: { type: array, description: 当前期望及最近确认的已生效修订引用。, items: { $ref: '#/components/schemas/CertificateBinding' } }
        historical_references: { type: integer, format: int64 }
        bindings_truncated: { type: boolean, description: 列表最多展示 10 条当前引用，详情最多 100 条；额外历史引用另计。 }
    CertificateResult:
      type: object
      required: [certificate, deleted]
      properties:
        certificate: { allOf: [{ $ref: '#/components/schemas/Certificate' }], nullable: true }
        deleted: { type: boolean }
    NginxFeature:
      type: object
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason: { type: string }
    NginxFeatures:
      type: object
      required: [available, version, features, reason]
      properties:
        available: { type: boolean }
        version: { type: string }
        reason: { type: string }
        features:
          type: object
          additionalProperties: { $ref: '#/components/schemas/NginxFeature' }
    WAFPath:
      type: object
      required: [match, path]
      properties:
        match: { type: string, enum: [exact, prefix] }
        path: { type: string, minLength: 1, maxLength: 512 }
    WAFConfig:
      type: object
      required: [metadata, rate, rate_unit, burst, connections, reject_status, observe, body_size, methods, denied_paths, exempt_paths]
      properties:
        metadata: { $ref: '#/components/schemas/ResourceMetadata' }
        rate: { type: integer, minimum: 0, maximum: 100000, description: 零表示关闭请求限速。 }
        rate_unit: { type: string, enum: [r/s, r/m] }
        burst: { type: integer, minimum: 0, maximum: 10000 }
        connections: { type: integer, minimum: 0, maximum: 65535, description: 零表示关闭并发限制。 }
        reject_status: { type: integer, enum: [429, 503] }
        observe: { type: boolean, description: 只观察请求限速和并发限制；方法和路径拒绝仍执行。 }
        body_size: { type: string, description: 空值继承；零表示不限制。 }
        methods: { type: array, maxItems: 16, items: { type: string } }
        denied_paths: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/WAFPath' } }
        exempt_paths: { type: array, maxItems: 128, description: 仅豁免方法与限流；ACL、明确拒绝路径和请求体限制继续执行。, items: { $ref: '#/components/schemas/WAFPath' } }
    WAFInput:
      allOf:
        - { $ref: '#/components/schemas/WAFConfig' }
        - type: object
          required: [base_version]
          properties:
            base_version: { type: integer, format: int64, minimum: 0 }
    WAFPolicy:
      type: object
      required: [id, http_file_id, server_file_id, config, editable, reason, resources]
      properties:
        id: { type: string }
        resources: { type: array, items: { type: string } }
        http_file_id: { type: string }
        server_file_id: { type: string }
        config: { $ref: '#/components/schemas/WAFConfig' }
        editable: { type: boolean }
        reason: { type: string }
    CreateResource:
      type: object
      required: [base_version, kind, listen, domains, upstream]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        kind: { type: string, enum: [http, stream] }
        listen: { type: array, minItems: 1, maxItems: 128, description: 每项为一条监听的地址及选项。, items: { type: string } }
        domains: { type: array, items: { type: string } }
        upstream: { type: string }
        upstream_servers: { type: array, maxItems: 128, items: { type: string } }
        metadata: { $ref: '#/components/schemas/ResourceMetadata' }
    SaveRequest:
      type: object
      required: [base_version, files, draft, validate]
      properties:
        base_version: { type: integer, format: int64, minimum: 0 }
        files: { type: array, minItems: 1, maxItems: 128, items: { $ref: '#/components/schemas/File' } }
        draft: { type: boolean }
        validate: { type: boolean }
        apply: { type: boolean, default: false }
    SaveResult:
      type: object
      required: [tree]
      properties:
        tree: { $ref: '#/components/schemas/Tree' }
        task_id: { type: string }
    Me:
      type: object
      required: [authenticated, bootstrap_required, csrf, username, scopes]
      properties:
        authenticated: { type: boolean }
        bootstrap_required: { type: boolean }
        csrf: { type: string }
        username: { type: string }
        scopes: { type: array, items: { type: string } }
    NginxRuntime:
      type: object
      required: [available, revision_id, deployment_id, integrity, running, reason, external_change]
      properties:
        external_change: { type: boolean }
        available: { type: boolean }
        revision_id: { type: string }
        deployment_id: { type: string }
        integrity: { type: boolean }
        running: { type: boolean }
        reason: { type: string }
    CredentialInput:
      type: object
      required: [name, scopes, allowed_sources, expires_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes: { type: array, items: { type: string } }
        allowed_sources: { type: array, items: { type: string } }
        expires_at: { type: integer, format: int64 }
    Module:
      type: object
      required: [id, name, available, enabled, dependencies]
      properties:
        id: { type: string }
        name: { type: string }
        available: { type: boolean }
        enabled: { type: boolean }
        dependencies: { type: array, items: { type: string } }
        reason: { type: string }
    Task:
      type: object
      required: [id, kind, state, stage, last_error, created_at, revision_id, observed_revision]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string }
        stage: { type: string }
        revision_id: { type: string }
        observed_revision: { type: string }
        last_error: { type: string }
        created_at: { type: integer, format: int64 }
