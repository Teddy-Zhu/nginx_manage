openapi: 3.0.3
info:
  title: NginxPanel Management API
  version: 0.1.0
  description: 首版发布前直接维护当前唯一合同。所有 JSON 响应使用统一外壳。
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /maintenance:
    {"get": {"operationId": "getMaintenance", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "enterMaintenance", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MaintenanceStartInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /maintenance/{id}/release:
    {"post": {"operationId": "releaseMaintenance", "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}], "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components:
    {"get": {"operationId": "getComponents", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /components/tasks:
    {"get": {"operationId": "listComponentTasks", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}, "post": {"operationId": "createComponentTask", "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ComponentCreateInput"}}}}, "responses": {"202": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations:
    {"get": {"operationId": "listMigrations", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}}}
  /migrations/export:
    {"post": {"operationId": "exportMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationExportInput"}}}}}}
  /migrations/plan:
    {"post": {"operationId": "prepareMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationImportInput"}}}}}}
  /migrations/pull:
    {"post": {"operationId": "pullMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationPullInput"}}}}}}
  /migrations/{id}:
    {"get": {"operationId": "getMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/ID"}]}}
  /migrations/{id}/execute:
    {"post": {"operationId": "executeMigration", "responses": {"200": {"$ref": "#/components/responses/JSON"}, "default": {"$ref": "#/components/responses/JSON"}}, "parameters": [{"$ref": "#/components/parameters/ID"}, {"$ref": "#/components/parameters/CSRF"}, {"$ref": "#/components/parameters/Idempotency"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MigrationExecuteInput"}}}}}}
  /system/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /system/version:
    get:
      operationId: getVersion
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /me:
    get:
      operationId: getMe
      security: []
      description: 匿名访问也返回 CSRF 与是否需要一次性引导初始化。
      responses:
        '200': { $ref: '#/components/responses/JSON' }
  /bootstrap:
    post:
      operationId: bootstrap
      security: []
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string, maxLength: 100 }
                username: { type: string, maxLength: 64 }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /session:
    post:
      operationId: login
      security: []
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: logout
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /session/reauthenticate:
    post:
      operationId: reauthenticate
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      description: 仅浏览器会话使用，更新五分钟的近期认证时间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /account/password:
    put:
      operationId: changePassword
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /sessions/revoke-all:
    post:
      operationId: revokeSessions
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /credentials:
    get:
      operationId: listCredentials
      x-scopes: [auth.manage]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    post:
      operationId: createCredential
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /credentials/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    delete:
      operationId: revokeCredential
      x-scopes: [auth.manage]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /system/capabilities:
    get:
      operationId: getCapabilities
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /system/modules:
    get:
      operationId: getModules
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /system/modules/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: setModule
      x-scopes: [system.write]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/config-tree:
    get:
      operationId: getConfigTree
      x-scopes: [config.secrets]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    put:
      operationId: saveConfigTree
      x-scopes: [config.write, config.secrets]
      description: 原文和投影同事务保存。validate 请求真实 Nginx 校验；apply 请求串行发布、运行确认及失败回滚。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRequest' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/apply:
    post:
      operationId: applyConfig
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version]
              properties:
                base_version: { type: integer, format: int64, minimum: 0 }
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/runtime:
    get:
      operationId: getNginxRuntime
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/config-tree/diff:
    post:
      operationId: diffConfigTree
      x-scopes: [config.secrets]
      description: 比较指定修订与请求中的完整原文树；原文差异包含秘密，浏览器需重新认证。
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiffRequest' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/external:
    get:
      operationId: inspectNginxExternal
      x-scopes: [config.secrets]
      description: 只读核对当前发布副本与已记录修订。path 只选择受管目录内已发现的文件；依赖只返回散列，不返回证书材料。
      parameters:
        - { name: path, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/external/capture:
    post:
      operationId: captureNginxExternal
      x-scopes: [config.write, config.secrets]
      description: 重新核对快照后，将选中文件合并为独立草稿；期望或磁盘内容冲突则拒绝，不应用外部配置。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureExternalRequest' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/external/restore:
    post:
      operationId: restoreNginxExternal
      x-scopes: [config.write, config.secrets, security.write]
      description: 重新核对外部快照，将当前已保存期望修订部署到新受管目录并确认运行结果；保留原外部目录，切换后不向外部内容回滚。浏览器需重新认证。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreExternalRequest' }
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/native-modules:
    put:
      operationId: setNginxNativeModules
      x-scopes: [config.write, config.secrets, security.write]
      description: 从本机 root 批准清单选择模块路径，按清单顺序定点更新主配置 load_module；只保存期望修订，仍须应用。
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeModulesRequest' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/config-tree/preview:
    post:
      operationId: previewConfigTree
      x-scopes: [config.write, config.secrets]
      parameters: [{ $ref: '#/components/parameters/CSRF' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/resources:
    post:
      operationId: createResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateResource' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/resources/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    patch:
      operationId: patchResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version, changes]
              properties:
                base_version: { type: integer, format: int64, minimum: 0 }
                metadata: { $ref: '#/components/schemas/ResourceMetadata' }
                changes:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/resources/{id}/copy:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: copyResource
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/access-lists:
    post:
      operationId: createAccessList
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessListInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /nginx/access-lists/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: updateAccessList
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessListInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteAccessList
      x-scopes: [config.write, config.secrets, security.write]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates:
    get:
      operationId: listCertificates
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    post:
      operationId: importCertificate
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: getCertificate
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    delete:
      operationId: deleteCertificate
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}/deploy-preview:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: previewCertificateDeploy
      description: 预览将所有现有 TLS 绑定切换到最新不可变证书版本；有待应用配置或信任链引用时拒绝，不返回配置原文。
      x-scopes: [config.write, config.secrets]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}/deploy:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: deployCertificate
      description: 根据预览的基础版本创建配置修订并排队执行标准 Nginx 安全应用任务；排队不代表证书已经生效。
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateDeployInput' }
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}/deployments:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    get:
      operationId: listCertificateDeployments
      description: 根据当前已确认应用修订统计最新版本绑定；包含停用站点的配置引用，不以排队成功或历史任务成功冒充当前运行状态。最近 32 条部署任务。
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /certificates/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    put:
      operationId: replaceCertificate
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateInput' }
      responses:
        '201': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /acme-accounts:
    get:
      operationId: listACMEAccounts
      x-scopes: [read]
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
    post:
      operationId: createACMEAccount
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ACMEAccountInput' }
      responses:
        '202': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /acme-accounts/{id}:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    delete:
      operationId: deleteACMEAccount
      description: 仅移除本机未被引用的账户记录和密钥，不向 CA 注销账户。
      x-scopes: [config.write, config.secrets]
      parameters:
        - { $ref: '#/components/parameters/Idempotency' }
        - { $ref: '#/components/parameters/CSRF' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceAction' }
      responses:
        '200': { $ref: '#/components/responses/JSON' }
        default: { $ref: '#/components/responses/JSON' }
  /acme-accounts/{id}/register:
    parameters: [{ $ref: '#/components/parameters/ID' }]
    post:
      operationId: registerACMEAccount
