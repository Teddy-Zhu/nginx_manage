components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: nginxpanel_session }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      description: 所有浏览器写操作必须携带，已验证机器 Token 无需此项。
      schema: { type: string }
    Idempotency: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
  responses:
    JSON:
      description: 统一响应；业务类型位于 data，失败时可为 null 或字段级诊断。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Response' }
  schemas:
    BackupInput:
      type: object
      additionalProperties: false
      required: [name, encryption, recipient, passphrase]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        encryption: {type: string, enum: [recipient, passphrase]}
        recipient: {type: string, description: 'recipient 模式为 age X25519 公钥；口令模式为空'}
        passphrase: {type: string, maxLength: 256, writeOnly: true, description: '口令模式 16–256 字节；recipient 模式为空；不持久保存'}
    BackupPolicyInput:
      type: object
      additionalProperties: false
      required: [base_version, enabled, recipient, key_saved, interval_hours, keep_count, retention_days, authorization_until]
      properties:
        base_version: {type: integer, format: int64, minimum: 1}
        enabled: {type: boolean}
        recipient: {type: string}
        key_saved: {type: boolean}
        interval_hours: {type: integer, format: int64, minimum: 1, maximum: 168}
        keep_count: {type: integer, minimum: 1, maximum: 15}
        retention_days: {type: integer, format: int64, minimum: 1, maximum: 90}
