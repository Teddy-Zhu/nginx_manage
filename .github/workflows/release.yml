name: Core binary release（核心程序发布）

on:
  push:
    # Generated development tags must not start a second build when a custom token publishes them.
    tags: ["v*", "!v*-[0-9]*.[0-9]*-dev"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有发布标签：正式版填 v0.1.0；从分支发布 Beta 时留空"
        required: false
        type: string
      version:
        description: "Beta 基础版本：如 0.1.0-dev，自动追加构建编号；填写 tag 时忽略"
        required: false
        default: 0.1.0-dev
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      create_tag: ${{ steps.identity.outputs.create_tag }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Bind release identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          RELEASE_BASE_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/identity.py --component panel --tag "$RELEASE_TAG" --version "$RELEASE_BASE_VERSION"
      - name: Create publication spec
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_NOTES: ${{ steps.identity.outputs.notes }}
          RELEASE_POLICY: ${{ steps.identity.outputs.policy }}
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          mkdir -p .release/input .release/binaries
          go build -trimpath -o "$RUNNER_TEMP/nginxpanel-release" ./cmd/nginxpanel-release
          "$RUNNER_TEMP/nginxpanel-release" spec --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --notes-file "$RELEASE_NOTES" --policy-file "$RELEASE_POLICY" --output .release/input/publication.json
      - name: Install locked frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Build matching frontend and static Linux binaries
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir web exec vite build
          mkdir -p internal/webui/dist
          cp -a web/dist/. internal/webui/dist/
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=true -ldflags "-s -w -X main.version=$RELEASE_VERSION" -o ".release/binaries/nginxpanel-$arch" ./cmd/nginxpanel
            GOOS=linux GOARCH="$arch" go list -deps -json ./cmd/nginxpanel >> .release/go-packages.json
          done
          pnpm --dir web list --prod --depth Infinity --json > .release/node-dependencies.json
      - name: Required centralized checks
        run: |
          make verify
          python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Generate source and build dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          syft-version: v1.54.0
          output-file: ${{ runner.temp }}/source.spdx.json
          config: deploy/release/syft.yaml
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Stage licenses and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/stage.py --input-root .release/input --source-sbom "$RUNNER_TEMP/source.spdx.json" --go-packages .release/go-packages.json --node-dependencies .release/node-dependencies.json --binaries .release/binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-input
          path: .release/input/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: .release/input
          merge-multiple: true
      - name: Assemble complete offline container installer
        run: bash scripts/package-containers.sh ".release/input/panel-linux-${{ matrix.architecture }}" "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-installer-${{ matrix.architecture }}
          path: |
            .release/input/panel-linux-${{ matrix.architecture }}/containers.json
            .release/input/panel-linux-${{ matrix.architecture }}/container-images.tar
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind publication metadata
        id: approval
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_CREATE_TAG: ${{ needs.build.outputs.create_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_CREATE_TAG" = true ]; then
            python3 scripts/release/identity.py --component panel --version "$RELEASE_VERSION" --reuse-version
          else
            python3 scripts/release/identity.py --component panel --tag "$RELEASE_TAG"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: .release/input
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-installer-*
          path: .release/container-installers
      - name: Include container archives in signed installation packages
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            cp ".release/container-installers/container-installer-$arch/containers.json" ".release/input/panel-linux-$arch/"
            cp ".release/container-installers/container-installer-$arch/container-images.tar" ".release/input/panel-linux-$arch/"
          done
      - name: Build publisher from the approved source commit
        run: go build -trimpath -o "$RUNNER_TEMP/nginxpanel-release" ./cmd/nginxpanel-release
      - name: Package and sign
        env:
          RELEASE_SEED: ${{ secrets.RELEASE_ED25519_SEED }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_ED25519_PUBLIC_KEY }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_NOTES: ${{ steps.approval.outputs.notes }}
          RELEASE_POLICY: ${{ steps.approval.outputs.policy }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/release-key.XXXXXX")"
          trap 'rm -rf -- "$keydir"' EXIT
          printf '%s\n' "$RELEASE_SEED" > "$keydir/seed"
          unset RELEASE_SEED
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          trust = dict(schema=1, repository=os.environ["RELEASE_REPOSITORY"],
                       keys=[dict(id=os.environ["RELEASE_KEY_ID"], public_key=os.environ["RELEASE_PUBLIC_KEY"])])
          for arch in ("amd64", "arm64"):
              path = Path(f".release/input/panel-linux-{arch}/release-trust.json")
              with path.open("x", encoding="utf-8") as output:
                  json.dump(trust, output)
                  output.write("\n")
              path.chmod(0o644)
          PY
          "$RUNNER_TEMP/nginxpanel-release" bundle --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --spec .release/input/publication.json --input-root .release/input --policy-file "$RELEASE_POLICY" --key-file "$keydir/seed" --key-id "$RELEASE_KEY_ID" --public-key "$RELEASE_PUBLIC_KEY" --output .release/output
      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_CREATE_TAG: ${{ needs.build.outputs.create_tag }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [ "$RELEASE_CREATE_TAG" = true ]; then options+=(--create-tag); fi
          python3 scripts/release/publish.py --repository "$GH_REPO" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory .release/output "${options[@]}"
