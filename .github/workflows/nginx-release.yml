name: Nginx Docker release

on:
  push:
    tags: ["nginx-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing nginx-v-prefixed SemVer tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nginx-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind component release identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_TAG:0:7}" = nginx-v
          version="${RELEASE_TAG#nginx-v}"
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$commit"
          test -s "deploy/release/notes/nginx/$version.md"
          test -s "deploy/release/policies/nginx/$version.json"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  images:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the image launcher and collect its dependency licenses
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/binaries
          GOOS=linux GOARCH="$RELEASE_ARCHITECTURE" go build -trimpath -buildvcs=true -ldflags "-s -w -X main.version=$RELEASE_VERSION" -o ".release/binaries/nginxpanel-$RELEASE_ARCHITECTURE" ./cmd/nginxpanel
          go list -deps -json ./cmd/nginxpanel > .release/go-packages.json
          python3 scripts/release/launcher.py --architecture "$RELEASE_ARCHITECTURE" --go-packages .release/go-packages.json
      - name: Required component checks
        run: go test ./internal/releases ./internal/nginxcontainer
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Build and push the native component image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/release/images.py build --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --architecture "$RELEASE_ARCHITECTURE" --input .release/binaries --output ".release/images-$RELEASE_ARCHITECTURE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nginx-build-${{ matrix.architecture }}
          path: .release/images-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

  publish:
    needs: [identity, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nginx-build-*
          path: .release/image-build-input
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Merge original digests and collect OCI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/release/images.py merge --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --input .release/image-build-input --output .release/images
      - name: Sign the independent component catalog
        env:
          RELEASE_SEED: ${{ secrets.RELEASE_ED25519_SEED }}
          RELEASE_PUBLIC_KEY: ${{ vars.RELEASE_ED25519_PUBLIC_KEY }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .release/input
          go build -trimpath -o "$RUNNER_TEMP/nginxpanel-release" ./cmd/nginxpanel-release
          "$RUNNER_TEMP/nginxpanel-release" spec --component nginx --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --notes-file "deploy/release/notes/nginx/$RELEASE_VERSION.md" --policy-file "deploy/release/policies/nginx/$RELEASE_VERSION.json" --output .release/input/publication.json
          keydir="$(mktemp -d "$RUNNER_TEMP/release-key.XXXXXX")"
          trap 'rm -rf -- "$keydir"' EXIT
          printf '%s\n' "$RELEASE_SEED" > "$keydir/seed"
          unset RELEASE_SEED
          "$RUNNER_TEMP/nginxpanel-release" bundle --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --spec .release/input/publication.json --input-root .release/input --images .release/images/publication.json --policy-file "deploy/release/policies/nginx/$RELEASE_VERSION.json" --key-file "$keydir/seed" --key-id "$RELEASE_KEY_ID" --public-key "$RELEASE_PUBLIC_KEY" --output .release/output
      - name: Publish the immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/images.py tag --repository "$RELEASE_REPOSITORY" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --input .release/output/release-manifest.json
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
      - name: Publish the signed component release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/publish.py --repository "$GH_REPO" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --directory .release/output
